name: Python Docker CI-CD


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: CI - Install dependencies and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker:
    name: CI - Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag devops-python-service:${{ github.sha }} .

      - name: Run container smoke test
        shell: bash
        run: |
          docker run --detach --name devops-python-service --publish 8000:8000 devops-python-service:${{ github.sha }}
          trap 'docker rm --force devops-python-service' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-python-service
          exit 1

  publish:
    name: CD - Publish Docker image
    runs-on: ubuntu-latest
    needs: docker
    # Publish only after a push to main. Pull requests run CI but do not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build --tag ${{ secrets.DOCKERHUB_USERNAME }}/devops-python-service:latest --tag ${{ secrets.DOCKERHUB_USERNAME }}/devops-python-service:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-python-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-python-service:${{ github.sha }}
